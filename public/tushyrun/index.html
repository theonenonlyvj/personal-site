<body>
<canvas id="c"></canvas>
<a id="credit" href="https://theonenonlyvj.github.io/personal-site/" rel="noopener">made with 🩷 for my wife · more vgames →</a>
<div class="hud">
  <div class="score">
    <span id="hearts">🩷 0</span>
    <div id="life"></div>
  </div>
  <div class="btns">
    <button id="speedB" aria-label="speed"></button>
    <button id="muteB" aria-label="sound">🔊</button>
    <button id="pauseB" aria-label="pause" class="hidden">⏸</button>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   TushyRun 🍑 — a silly one-button chase; a love letter.
   Cozy palette + Fredoka + a day/evening/night clock.
   No accounts, no analytics, no tracking.
   ============================================================ */

/* ---------- time-of-day theme ---------- */
const SCHED = { dayStart: 7*60, eveningStart: 18*60+30, nightStart: 22*60 };
function themeMode(d = new Date()){
  const m = d.getHours()*60 + d.getMinutes();
  if (m >= SCHED.nightStart || m < SCHED.dayStart) return "night";
  if (m >= SCHED.eveningStart) return "evening";
  return "day";
}
const PALETTES = {
  day: {
    skyTop:"#d8f2f6", skyBot:"#fff8ed", ink:"#17353b", inkSoft:"#3d6470",
    hillFar:"#c8f1f4", hillNear:"#a5e3ec", ground:"#17353b",
    cheeks:"#f6c2d0", cheekLine:"#17353b", pink:"#ff46b0", coral:"#f07b3f",
    teal:"#099cb4", sun:"#ffd98a", cloud:"rgba(255,255,255,.85)",
    berry:"#e0518f", berryLeaf:"#3f9b7a", meterBg:"rgba(23,53,59,.14)"
  },
  evening: {
    skyTop:"#f6c2d0", skyBot:"#fff1de", ink:"#2e2733", inkSoft:"#5d4b60",
    hillFar:"#e5c3d4", hillNear:"#c9a0ba", ground:"#2e2733",
    cheeks:"#f3b3c6", cheekLine:"#2e2733", pink:"#ff46b0", coral:"#f07b3f",
    teal:"#168fa2", sun:"#f07b3f", cloud:"rgba(255,239,225,.8)",
    berry:"#d94f89", berryLeaf:"#3f8b6f", meterBg:"rgba(46,39,51,.16)"
  },
  night: {
    skyTop:"#03171d", skyBot:"#0b323c", ink:"#f2dfe7", inkSoft:"#b7a9ba",
    hillFar:"#0e3d49", hillNear:"#155263", ground:"#f2dfe7",
    cheeks:"#d98aa8", cheekLine:"#f2dfe7", pink:"#ff7cc4", coral:"#e69a71",
    teal:"#62c4d0", sun:"#c6f3f1", cloud:"rgba(198,243,241,.14)",
    berry:"#e070a2", berryLeaf:"#5fae91", meterBg:"rgba(242,223,231,.15)"
  }
};
let MODE = themeMode();
let P = PALETTES[MODE];
let pauseDirty = true;   // forces a redraw of non-play states after any change
const themeMeta = document.querySelector('meta[name="theme-color"]');
function applyMode(m){
  MODE = m; P = PALETTES[MODE];
  document.body.classList.toggle("night", MODE === "night");
  if (themeMeta) themeMeta.setAttribute("content", P.skyTop);
  pauseDirty = true;
}
applyMode(MODE);

/* ---------- canvas ---------- */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let DPR = 1, W = 0, H = 0;          // css pixels
let S = 1, worldW = 0, worldH = 0;  // world units (≈900-tall reference)
let groundY = 0, chaserX = 0, GAP_MAX = 460;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  S = Math.min(H / 900, W / 1100);
  worldW = W / S; worldH = H / S;
  groundY = worldH - Math.max(150, worldH * 0.16);
  chaserX = Math.max(110, worldW * 0.13);
  GAP_MAX = Math.min(540, Math.max(300, (worldW - chaserX) * 0.55));
  if (player && player.y > groundY) { player.y = groundY; player.vy = 0; }
  if (runner && runner.y > groundY) { runner.y = groundY; runner.vy = 0; }
  pauseDirty = true;
}
window.addEventListener("resize", resize);

/* ---------- hand-drawn "boiling" jitter ---------- */
let boilSeed = 1;
function jit(i, amt = 2.6){
  const x = Math.sin(i * 127.1 + boilSeed * 311.7) * 43758.5453;
  return (x - Math.floor(x) - 0.5) * 2 * amt;
}
function rnd(seed){ // deterministic 0..1 from a seed (for scenery)
  const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

/* localStorage can throw (private mode, file:// quirks) — never let that
   reach the game loop; persistence just degrades to in-memory */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

/* ---------- audio (all synthesized, nothing loaded) ---------- */
let AC = null, masterGain = null;
let muted = lsGet("tushyrun_muted") === "1";
function initAudio(){
  if (AC || typeof (window.AudioContext || window.webkitAudioContext) !== "function") return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain();
    masterGain.gain.value = muted ? 0 : 0.4;
    masterGain.connect(AC.destination);
  } catch(e){ AC = null; }
}
function tone(type, f0, f1, t0, dur, vol = 1){
  if (!AC || muted) return;
  const t = AC.currentTime + t0;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  jump(){ tone("sine", 320, 640, 0, 0.13, 0.5); },
  honk(){ // clown-horn honk-honk + sparkle
    tone("square", 230, 195, 0,    0.10, 0.32);
    tone("square", 185, 150, 0.14, 0.17, 0.36);
    tone("sine", 820, 830, 0.30, 0.09, 0.30);
    tone("sine", 1040, 1050, 0.39, 0.09, 0.30);
    tone("sine", 1310, 1320, 0.48, 0.13, 0.30);
  },
  wah(){ tone("sawtooth", 210, 85, 0, 0.38, 0.22); },
  squeak(){ tone("sine", 900, 1500, 0, 0.10, 0.4); },
  dash(){ tone("sine", 500, 900, 0, 0.16, 0.2); }
};

/* ---------- state ---------- */
let state = "title";           // title | play | pause
let player, runner, obstacles, berries, particles, pops;
let clouds, fireflies;
let speed, playT, gap, dashT, celebT, hitstopT, berryTimer, spawnX, dist = 0;
let hearts = 0;
let lifetime = parseInt(lsGet("tushyrun_life") || "0", 10) || 0;
let lastSqueezePhrase = -1;
const PHRASES = ["SQUEEZE!", "HONK!", "GOTCHA!", "SQUISH!", "MWAH!"];

const GRAV = 3000, JUMP_V = 1120;
const DASH_DUR = 1.4, CELEB_DUR = 0.7;

function newFigure(){
  return { y: 0, vy: 0, grounded: true, runPhase: Math.random()*6,
           buffer: 0, stumbleT: 0, invulnT: 0, lookBackT: 0, squashT: 0 };
}
function resetRun(){
  player = newFigure(); runner = newFigure();
  player.y = groundY; runner.y = groundY;
  obstacles = []; berries = []; particles = []; pops = [];
  speed = 300; playT = 0; gap = GAP_MAX; dashT = 0; celebT = 0; hitstopT = 0;
  berryTimer = 5; spawnX = worldW + 400;   // dist deliberately kept — scenery flows through restarts
  hearts = 0; updateHud();
}
function initScenery(){
  clouds = [];
  for (let i = 0; i < 4; i++)
    clouds.push({ x: Math.random()*1.2, y: 0.08 + Math.random()*0.24,
                  s: 0.7 + Math.random()*0.7, spd: 6 + Math.random()*7 });
  fireflies = [];
  for (let i = 0; i < 6; i++)
    fireflies.push({ x: Math.random(), p: Math.random()*7 });
}

/* ---------- HUD ---------- */
const heartsEl = document.getElementById("hearts");
const lifeEl = document.getElementById("life");
const muteB = document.getElementById("muteB");
const pauseB = document.getElementById("pauseB");
function updateHud(){
  heartsEl.textContent = "🩷 " + hearts;
  lifeEl.textContent = lifetime > 0 ? "lifetime squeezes: " + lifetime : "";
  muteB.textContent = muted ? "🔇" : "🔊";
}
muteB.addEventListener("pointerdown", e => {
  e.stopPropagation(); e.preventDefault();
  muted = !muted;
  lsSet("tushyrun_muted", muted ? "1" : "0");
  if (masterGain) masterGain.gain.value = muted ? 0 : 0.4;
  updateHud();
});
pauseB.addEventListener("pointerdown", e => {
  e.stopPropagation(); e.preventDefault();
  if (state === "play") setState("pause");
  else if (state === "pause") setState("play");
});
const speedB = document.getElementById("speedB");
let fastMode = lsGet("tushyrun_speed") === "fast";
function setFast(v){
  fastMode = v;
  lsSet("tushyrun_speed", v ? "fast" : "slow");
  speedB.textContent = fastMode ? "🐇 fast" : "🐢 slow";
}
speedB.addEventListener("pointerdown", e => {
  e.stopPropagation(); e.preventDefault();
  setFast(!fastMode);
});
setFast(fastMode);
const creditEl = document.getElementById("credit");
creditEl.addEventListener("pointerdown", e => e.stopPropagation());
function setState(s){
  state = s;
  pauseDirty = true;
  pauseB.classList.toggle("hidden", s === "title");
  pauseB.textContent = s === "pause" ? "▶️" : "⏸";
  speedB.classList.toggle("hidden", s === "play");
  creditEl.classList.toggle("hidden", s !== "title");
}

/* ---------- input ---------- */
function press(){
  initAudio();
  if (AC && AC.state === "suspended") AC.resume();
  if (state === "title"){ resetRun(); setState("play"); return; }
  if (state === "pause"){ setState("play"); return; }
  if (state === "play"){
    player.buffer = 0.12;
  }
}
window.addEventListener("pointerdown", e => { press(); }, { passive: true });
window.addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.code === "Space" || e.code === "ArrowUp"){ e.preventDefault(); press(); }
  else if (e.code === "KeyP" || e.code === "Escape"){
    if (state === "play") setState("pause");
    else if (state === "pause") setState("play");
  }
});
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("visibilitychange", () => {
  if (document.hidden && state === "play") setState("pause");
});

/* ---------- obstacles ---------- */
const OBS_TYPES = [
  { kind:"cat",    w: 78, h: 56 },
  { kind:"basket", w: 72, h: 60 },
  { kind:"plant",  w: 58, h: 74 },
  { kind:"roomba", w: 76, h: 26, extraV: 90 }
];
function spawnObstacle(){
  const t = OBS_TYPES[Math.floor(Math.random()*OBS_TYPES.length)];
  obstacles.push({ ...t, x: worldW + 120, toppled: 0, seed: Math.random()*100, wob: 0 });
}
function scheduleGap(){
  const k = Math.min(1, (speed - 300) / 320);   // 0 easy → 0.75 at the speed cap: density plateaus before max
  const tMin = 1.7 - 0.5*k, tMax = 2.7 - 0.8*k;
  return speed * (tMin + Math.random() * (tMax - tMin));
}

/* ---------- particles & pops ---------- */
function burstHearts(x, y, n){
  for (let i = 0; i < n; i++)
    particles.push({ kind:"heart", x, y: y - 20,
      vx: (Math.random()-0.3)*260, vy: -140 - Math.random()*260,
      r: 9 + Math.random()*10, rot: Math.random()*6, vr: (Math.random()-.5)*6,
      t: 0, life: 0.9 + Math.random()*0.5 });
}
function puff(x, y, n = 4){
  for (let i = 0; i < n; i++)
    particles.push({ kind:"puff", x: x + jit(i,14), y,
      vx: -40 - Math.random()*60, vy: -20 - Math.random()*40,
      r: 6 + Math.random()*8, t: 0, life: 0.45 });
}
function sweat(x, y){
  for (let i = 0; i < 5; i++)
    particles.push({ kind:"sweat", x, y: y - 110,
      vx: (Math.random()-.5)*320, vy: -200 - Math.random()*160,
      r: 5, t: 0, life: 0.6 });
}
function pop(x, y, text, big){
  pops.push({ x, y, text, t: 0, life: 1.0, big: !!big });
}

/* ---------- update ---------- */
function doJump(f){
  f.vy = -JUMP_V; f.grounded = false; f.buffer = 0;
  f.runPhase = 0;
}
function stepClouds(d){
  for (const c of clouds){
    c.x -= (c.spd / worldW) * d * 3;
    if (c.x < -0.25) { c.x = 1.15; c.y = 0.08 + Math.random()*0.24; }
  }
}
function update(dt){
  boil();
  if (state === "pause") return;
  if (state === "title"){         // gentle stroll behind the title card
    dist += 120 * dt;
    stepClouds(dt);
    return;
  }

  if (hitstopT > 0){ hitstopT -= dt; return; }
  let ts = 1;
  if (celebT > 0){ ts = 0.35; celebT -= dt; if (celebT <= 0) { dashT = DASH_DUR; sfx.dash(); } }
  const d = dt * ts;

  playT += d;
  speed = Math.min(540, 300 + playT * 1.2 + hearts * 5) * (fastMode ? 1.35 : 1);
  dist += speed * d;

  /* gap dynamics */
  if (dashT > 0){
    dashT -= d;
    const p = 1 - Math.max(dashT, 0) / DASH_DUR;
    gap = GAP_MAX * (1 - Math.pow(1 - p, 3));
  } else if (celebT <= 0){
    if (player.stumbleT <= 0) gap -= (fastMode ? 44 : 34) * d;   // fast mode: quicker squeezes too
    gap = Math.min(gap, GAP_MAX);
    if (gap <= 0 && player.stumbleT <= 0) squeeze();
  }

  /* player physics */
  const pl = player;
  pl.buffer -= d;
  if (pl.stumbleT > 0){
    pl.stumbleT -= d;
    if (pl.stumbleT <= 0) pl.invulnT = 1.2;
  } else if (pl.buffer > 0 && pl.grounded){
    doJump(pl); sfx.jump();
  }
  pl.invulnT -= d;
  stepFigure(pl, d);
  pl.runPhase += d * (8 + speed / 60);

  /* runner physics + auto-jump */
  const ru = runner;
  const rx = runnerX();
  if (ru.grounded){
    for (const o of obstacles){
      if (o.toppled) continue;
      const relV = speed + (o.extraV || 0);
      const dx = o.x - rx;
      if (dx > 0 && dx < relV * 0.33 + 46){ doJump(ru); break; }
    }
  }
  stepFigure(ru, d);
  ru.runPhase += d * (8 + speed / 60);
  ru.lookBackT -= d;
  if (ru.lookBackT < -4 - Math.random()*3) ru.lookBackT = 0.9;
  ru.squashT -= d;

  /* obstacles */
  spawnX -= speed * d;
  if (spawnX <= 0){ spawnObstacle(); spawnX = scheduleGap(); }
  for (const o of obstacles){
    o.x -= (speed + (o.extraV || 0)) * d;
    if (o.toppled) o.wob += d;
  }
  obstacles = obstacles.filter(o => o.x > -160);

  /* collision (forgiving; the squeeze celebration + escape dash are safe time) */
  if (pl.stumbleT <= 0 && pl.invulnT <= 0 && celebT <= 0 && dashT <= 0){
    const pTop = pl.y - 118, pL = chaserX - 18, pR = chaserX + 18;
    for (const o of obstacles){
      if (o.toppled) continue;
      const oL = o.x + o.w * 0.18, oR = o.x + o.w * 0.82;
      const oTop = groundY - o.h * 0.82;
      if (pR > oL && pL < oR && pl.y > oTop && pTop < groundY){
        o.toppled = 1;
        pl.stumbleT = 0.7;
        gap = Math.min(GAP_MAX, gap + 170);
        sweat(chaserX, pl.y);
        pop(chaserX, pl.y - 150, "oof!", false);
        sfx.wah();
        break;
      }
    }
  }

  /* razberries */
  berryTimer -= d;
  if (berryTimer <= 0){
    berries.push({ x: worldW + 60, y: groundY - (130 + Math.random()*85), t: Math.random()*6 });
    berryTimer = 6 + Math.random()*3;
  }
  for (const b of berries){ b.x -= speed * d; b.t += d; }
  berries = berries.filter(b => {
    if (b.x < -40) return false;
    const dx = b.x - chaserX, dy = b.y - (player.y - 70);
    if (dx*dx + dy*dy < 42*42){
      gap = Math.max(0, gap - 44);
      sfx.squeak();
      pop(b.x, b.y - 24, "yum!", false);
      for (let i = 0; i < 4; i++)
        particles.push({ kind:"puff", x: b.x, y: b.y, vx:(Math.random()-.5)*160,
                         vy:(Math.random()-.5)*160, r: 5, t: 0, life: 0.35 });
      return false;
    }
    return true;
  });

  /* particles / pops */
  for (const p of particles){
    p.t += d;
    p.x += (p.vx || 0) * d; p.y += (p.vy || 0) * d;
    if (p.kind === "heart"){ p.vy += 500 * d; p.rot += p.vr * d; }
    if (p.kind === "sweat"){ p.vy += 900 * d; }
  }
  particles = particles.filter(p => p.t < p.life);
  for (const t of pops) t.t += d;   // same clock as particles so slow-mo stretches both
  pops = pops.filter(t => t.t < t.life);

  /* scenery */
  stepClouds(d);
}
function stepFigure(f, d){
  if (!f.grounded){
    f.vy += GRAV * d;
    f.y += f.vy * d;
    if (f.y >= groundY){
      f.y = groundY; f.vy = 0; f.grounded = true;
      if (f === player){ puff(chaserX, groundY); }
    }
  } else {
    f.y = groundY;
  }
}

function squeeze(){

  runner.squashT = 0.55;
  lastSqueezePhrase = (lastSqueezePhrase + 1) % PHRASES.length;
  pop(runnerX(), runner.y - 190, PHRASES[lastSqueezePhrase], true);

/* ---------- figures ---------- */
function drawChaser(x, y, f){
  const ink = P.ink;
  ctx.save();
  ctx.translate(x, y);
  if (f.stumbleT > 0){
    const p = 1 - f.stumbleT / 0.7;
    ctx.translate(0, -55);
    ctx.rotate(p * Math.PI * 2);
    ctx.translate(0, 55);
  } else if (f.invulnT > 0 && Math.floor(f.invulnT * 12) % 2 === 0){
    ctx.globalAlpha = 0.45;
  }
  ctx.rotate(0.1);
  const ph = f.runPhase;
  const airborne = !f.grounded;
  /* legs */
  ctx.beginPath();
  for (let s = 0; s < 2; s++){
    const a = airborne ? (s ? 0.8 : -0.5) : Math.sin(ph + s * Math.PI) * 0.85;
    const kx = Math.sin(a) * 34, ky = -Math.cos(a) * 6;
    const fx = kx + Math.sin(a - 0.5) * 30, fy = airborne ? -34 : 0;
    ctx.moveTo(jit(s), -62 + jit(s + 9));
    ctx.quadraticCurveTo(kx, -34 + ky, fx + jit(s + 3), fy - (airborne ? 0 : Math.max(0, Math.sin(ph + s*Math.PI)) * 16));
  }
  stroke(ink, 7);
  /* body */
  ctx.beginPath();
  line(0, -62, 10, -118, 1, 2);
  stroke(ink, 7);
  /* arms — both stretched forward, grabby */
  const grab = Math.sin(ph * 2.2) * 0.5 + 0.5;   // 0 closed → 1 open
  for (let s = 0; s < 2; s++){
    const ay = -112 + s * 14;
    const hx = 52 + s * 6, hy = ay + 8 + jit(s + 20, 2);
    ctx.beginPath();
    ctx.moveTo(8 + jit(s+5), ay + jit(s+6));
    ctx.quadraticCurveTo(30, ay - 4, hx, hy);
    stroke(ink, 6.5);
    /* grabby hand: palm + fingers that open/close */
    ctx.beginPath();
    ctx.arc(hx + 6, hy, 7.5, 0, Math.PI*2);
    stroke(ink, 4.5);
    ctx.beginPath();
    for (let fi = 0; fi < 3; fi++){
      const fa = -0.7 + fi * 0.55 + grab * 0.5;
      line(hx + 6 + Math.cos(fa)*7, hy + Math.sin(fa)*7,
           hx + 6 + Math.cos(fa)*(13 + grab*5), hy + Math.sin(fa)*(13 + grab*5),
           s*10+fi, s*10+fi+1);
    }
    stroke(ink, 3.5);
  }
  /* head */
  const hx0 = 14, hy0 = -142;
  ctx.beginPath();
  ctx.arc(hx0 + jit(30), hy0 + jit(31), 25, 0, Math.PI*2);
  stroke(ink, 7);
  /* ponytail */
  ctx.beginPath();
  ctx.moveTo(hx0 - 20, hy0 - 12);
  ctx.quadraticCurveTo(hx0 - 44, hy0 - 22 + jit(33, 4), hx0 - 40, hy0 + 4 + jit(34, 4));
  stroke(ink, 5.5);
  /* face: determined eyes + open smile */
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.arc(hx0 + 8, hy0 - 5, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hx0 + 19, hy0 - 5, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.arc(hx0 + 13, hy0 + 6, 8, 0.15, Math.PI - 0.15);
  stroke(ink, 4);
  ctx.restore();
}
function drawRunner(x, y, f){
  const ink = P.ink;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.06);
  const ph = f.runPhase;
  const airborne = !f.grounded;
  /* legs */
  ctx.beginPath();
  for (let s = 0; s < 2; s++){
    const a = airborne ? (s ? 0.9 : -0.4) : Math.sin(ph + s * Math.PI) * 0.9;
    const kx = Math.sin(a) * 34;
    const fx = kx + Math.sin(a - 0.5) * 30, fy = airborne ? -30 : 0;
    ctx.moveTo(jit(s+40), -60 + jit(s + 49));
    ctx.quadraticCurveTo(kx, -32, fx + jit(s + 43), fy - (airborne ? 0 : Math.max(0, Math.sin(ph + s*Math.PI)) * 16));
  }
  stroke(ink, 7);
  /* THE TUSHY — two proud cheeks, jiggling */
  const squash = f.squashT > 0 ? 1 : 0;
  const jig = Math.sin(ph * 1.9);
  const cw = 24 * (1 + 0.10*jig) * (squash ? 1.45 : 1);
  const chh = 26 * (1 - 0.08*jig) * (squash ? 0.55 : 1);
  ctx.fillStyle = P.cheeks;
  for (let s = 0; s < 2; s++){
    const cy = -74 + s * 30 + jig * 3 * (s ? -1 : 1);
    ctx.beginPath();
    ctx.ellipse(-26 + jit(s+60, 1.5), cy, cw, chh, -0.15, 0, Math.PI*2);
    ctx.fill();
    stroke(P.cheekLine, 5);
  }
  if (squash){ // little starburst when squeezed
    ctx.beginPath();
    for (let i = 0; i < 5; i++){
      const a = i * 1.256 + 0.4;
      line(-26 + Math.cos(a)*46, -60 + Math.sin(a)*46,
           -26 + Math.cos(a)*60, -60 + Math.sin(a)*60, i+70, i+71);
    }
    stroke(P.pink, 4);
  }
  /* body */
  ctx.beginPath();
  line(0, -60, -6, -118, 44, 45);
  stroke(ink, 7);
  /* pumping arms */
  for (let s = 0; s < 2; s++){
    const a = Math.sin(ph + s * Math.PI) * 0.9;
    ctx.beginPath();
    ctx.moveTo(-5 + jit(s+46), -108 + jit(s+47));
    ctx.quadraticCurveTo(Math.sin(a)*26 - 4, -92, Math.sin(a)*34 - 2, -78 + Math.cos(a)*10);
    stroke(ink, 6.5);
  }
  /* head */
  const hx0 = -10, hy0 = -142;
  ctx.beginPath();
  ctx.arc(hx0 + jit(50), hy0 + jit(51), 25, 0, Math.PI*2);
  stroke(ink, 7);
  /* face: looks back when taunting or squeezed */
  const back = f.lookBackT > 0 || f.squashT > 0;
  ctx.fillStyle = ink;
  if (back){
    ctx.beginPath(); ctx.arc(hx0 - 14, hy0 - 5, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx0 - 4, hy0 - 5, 3.4, 0, Math.PI*2); ctx.fill();
    if (f.squashT > 0){ // startled O mouth
      ctx.beginPath(); ctx.arc(hx0 - 9, hy0 + 8, 5.5, 0, Math.PI*2); stroke(ink, 4);
    } else {            // cheeky grin back at you
      ctx.beginPath(); ctx.arc(hx0 - 9, hy0 + 5, 8, 0.35, Math.PI - 0.35); stroke(ink, 4);
    }
  } else {
    ctx.beginPath(); ctx.arc(hx0 - 2, hy0 - 5, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx0 + 9, hy0 - 5, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.arc(hx0 + 4, hy0 + 6, 7, 0.2, Math.PI - 0.4);
    stroke(ink, 4);
  }
  ctx.restore();
}

function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, worldH);
  g.addColorStop(0, P.skyTop); g.addColorStop(1, P.skyBot);

  ctx.fillRect(0, 0, worldW, worldH);

  }

    for (let i = 0; i < 34; i++){

      ctx.globalAlpha = 0.35 + 0.6 * Math.abs(Math.sin(performance.now()/1000 * 1.5 + i));

    ctx.beginPath();
    ctx.arc(cx, cy, 26*s, 0, Math.PI*2);
    ctx.arc(cx + 26*s, cy + 4*s, 20*s, 0, Math.PI*2);

  }

function drawHills(){
  for (const [par, col, rmin, rvar, gapW] of [[0.22, P.hillFar, 90, 120, 300], [0.45, P.hillNear, 60, 90, 260]]){
    const off = dist * par;
    ctx.fillStyle = col;
    const k0 = Math.floor(off / gapW) - 1;
    for (let k = k0; k < k0 + Math.ceil(worldW / gapW) + 3; k++){
      const r = rmin + rnd(k * 13 + par * 100) * rvar;
      const cx = k * gapW - off + rnd(k+par) * 60;
      ctx.beginPath();
      ctx.arc(cx, groundY + r * 0.55, r, Math.PI, 0);
      ctx.fill();
    }
  }
}
function drawGround(){
  ctx.beginPath();
  const seg = 90;
  let first = true;
  for (let x = -20; x <= worldW + 40; x += seg){
    const y = groundY + jit(Math.floor((x + dist) / seg), 3);
    if (first){ ctx.moveTo(x, y); first = false; }
    else ctx.lineTo(x, y);
  }
  stroke(P.ground, 6);
  /* grass tufts + flowers, procedurally recycled */
  const tuft = 110;
  const k0 = Math.floor(dist / tuft);
  for (let k = k0; k < k0 + Math.ceil(worldW / tuft) + 2; k++){
    const x = k * tuft - dist + rnd(k) * 60;
    if (x < -20 || x > worldW + 20) continue;
    ctx.beginPath();
    for (let i = 0; i < 3; i++)
      line(x + i*6 - 6, groundY + 2, x + i*7 - 8 + jit(k+i, 3), groundY - 12 - rnd(k+i)*8, k+i, k+i+1);
    stroke(P.ground, 3);
    if (rnd(k * 3) < 0.3 && MODE !== "night"){
      ctx.fillStyle = rnd(k*5) < 0.5 ? P.pink : P.coral;
      ctx.beginPath(); ctx.arc(x + 14, groundY - 16, 5, 0, Math.PI*2); ctx.fill();
    }
  }
  if (MODE === "night"){
    for (const f of fireflies){
      const fx = ((f.x * worldW + Math.sin(performance.now()/1000 + f.p) * 40) % worldW + worldW) % worldW;
      const fy = groundY - 40 - Math.sin(performance.now()/700 + f.p * 3) * 30;
      const a = 0.4 + 0.5 * Math.abs(Math.sin(performance.now()/500 + f.p));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#ffe9a8";
      ctx.beginPath(); ctx.arc(fx, fy, 3.4, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function drawHeart(x, y, r, rot, alpha){
  ctx.save();

  ctx.beginPath();
  ctx.moveTo(0, r * 0.35);
  ctx.bezierCurveTo(-r, -r * 0.45, -r * 0.5, -r * 1.1, 0, -r * 0.35);
  ctx.bezierCurveTo(r * 0.5, -r * 1.1, r, -r * 0.45, 0, r * 0.35);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawParticles(){
  for (const p of particles){
    const a = 1 - p.t / p.life;
    if (p.kind === "heart") drawHeart(p.x, p.y, p.r, p.rot, a);
    else if (p.kind === "puff"){
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = P.inkSoft;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + p.t*2), 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.kind === "sweat"){
      ctx.globalAlpha = a;
      ctx.fillStyle = P.teal;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

}
function drawPause(){
  ctx.fillStyle = MODE === "night" ? "rgba(3,23,29,.55)" : "rgba(255,248,237,.6)";
  ctx.fillRect(0, 0, worldW, worldH);
  ctx.textAlign = "center";
  ctx.font = "700 56px Fredoka, ui-rounded, sans-serif";
  ctx.fillStyle = P.ink;
  ctx.fillText("paused", worldW/2, worldH * 0.42);
  ctx.font = "500 28px Fredoka, ui-rounded, sans-serif";
  ctx.fillStyle = P.inkSoft;
  ctx.fillText("tap to keep chasing 🍑", worldW/2, worldH * 0.42 + 46);
}

/* ---------- render ---------- */
function render(){
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  drawSky();
  drawHills();
  drawGround();
  if (state === "title"){
    drawTitle();
    return;
  }
  for (const o of obstacles) drawObstacle(o);
  for (const b of berries) drawBerry(b);
  /* dash speed-lines behind the runner while it escapes */
  if (dashT > 0.35){
    ctx.beginPath();
    const rx = runnerX();
    for (let i = 0; i < 3; i++)
      line(rx - 70 - i*26, runner.y - 60 - i*26, rx - 120 - i*30, runner.y - 60 - i*26, i+120, i+121);
    stroke(P.inkSoft, 4);
  }
  drawRunner(runnerX(), runner.y, runner);
  drawChaser(chaserX, player.y, player);
  drawParticles();
  drawPops();
  drawMeter();
  if (state === "pause") drawPause();
}

/* ---------- main loop ---------- */
let lastT = 0;
function frame(now){
  if (!lastT) lastT = now;
  let dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  if (now - lastBoil > 110){ boilSeed = (boilSeed + 1) % 1000; lastBoil = now; }
  update(dt);
  if (state !== "pause" || pauseDirty){   // paused scene is static — render once, save battery
    render();
    pauseDirty = false;
  }
  requestAnimationFrame(frame);
}

/* ---------- go ---------- */
resize();
initScenery();
resetRun();       // pre-warm a run behind the title so scenery scrolls
state = "title";
updateHud();
requestAnimationFrame(frame);

/* refresh day/evening/night if she leaves it open across a boundary */
setInterval(() => {
  const m = themeMode();
  if (m !== MODE) applyMode(m);
}, 30000);

/* tiny hook for headless smoke-testing (harmless in normal play) */
window.__tushy = {
  get state(){ return state; }, setState, press,
  get gap(){ return gap; }, set gap(v){ gap = v; },
  get spawnX(){ return spawnX; }, set spawnX(v){ spawnX = v; },
  get speed(){ return speed; }, get fast(){ return fastMode; }, setFast,
  get hearts(){ return hearts; },
  get obstacles(){ return obstacles; },
  update, render, resize,
  player: () => player, runner: () => runner
};
</script>
</body>
